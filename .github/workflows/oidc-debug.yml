name: OIDC claims check

# Manual diagnostic: prints the claims GitHub puts in the OIDC token so the
# AWS role trust policy can be matched against them. Prints no secrets (the
# signed token itself is not shown).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Decode token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' | base64 -d)
          echo "$PAYLOAD" | jq '{iss, sub, aud, repository, repository_owner, ref, event_name, job_workflow_ref, runner_environment}'
