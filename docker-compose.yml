services:
  app:
    build: .
    image: ap-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
    # Bound to localhost only; the host's Caddy reverse-proxies
    # api.asiapharmsg.com to 127.0.0.1:8000 (see caddy/Caddyfile).
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# The database is Amazon RDS (see DB_* in .env) and the reverse proxy is the
# Caddy service installed on the host, so neither runs in this compose file.
